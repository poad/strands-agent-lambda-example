packages:
  - .
  - ./agent
  - ./deploy-role

allowBuilds:
  esbuild: false
  protobufjs: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@11.22.0
  - brace-expansion@5.0.9

overrides:
  semver: '>=7'

strictPeerDependencies: false

trustPolicy: no-downgrade
